{% extends 'base.html' %}

{% block title %}Entrar · Mi Blog{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="bg-white p-4 p-lg-5 rounded shadow-sm">
            <h1 class="h3 mb-4 text-center"><i class="bi bi-box-arrow-in-right"></i> Iniciar sesión</h1>

            {% if form.errors %}
                <div class="alert alert-danger">Usuario o contraseña incorrectos.</div>
            {% endif %}

            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label for="{{ form.username.id_for_label }}" class="form-label">Usuario</label>
                    <input type="text" name="username" id="{{ form.username.id_for_label }}"
                           class="form-control" required autofocus>
                </div>
                <div class="mb-3">
                    <label for="{{ form.password.id_for_label }}" class="form-label">Contraseña</label>
                    <input type="password" name="password" id="{{ form.password.id_for_label }}"
                           class="form-control" required>
                </div>
                <input type="hidden" name="next" value="{{ next }}">
                <button type="submit" class="btn btn-primary w-100">Entrar</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
